<style>

.top-alert-icon{font-size:1.4rem;flex-shrink:0;line-height:1}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.4)}

.strategic-panel{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4550;background:rgba(15,23,42,.95);border:1px solid rgba(250,204,21,.5);border-radius:10px;padding:8px 12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);backdrop-filter:blur(10px);font-size:.72rem;max-height:30vh;overflow-y:auto}

.panel{position:absolute;left:6px;right:6px;bottom:calc(72px + var(--safe-bottom));background:var(--panel);border:1px solid #1f3540;border-radius:10px;overflow:hidden;z-index:900;backdrop-filter:blur(12px);display:flex;flex-direction:column;max-height:22vh;transition:max-height .2s ease}

.tag.prio{background:rgba(251,191,36,.25);color:#fbbf24}

.panel-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:10px}
.hud-bottom{position:absolute;bottom:var(--safe-bottom);left:0;right:0;z-index:1000;padding:0 6px 4px;pointer-events:none}

.btn-row{display:flex;gap:4px;overflow-x:auto;padding:3px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.btn-row::-webkit-scrollbar{display:none}
button{background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.28);color:var(--text);padding:0;border-radius:8px;font-size:.9rem;line-height:1;cursor:pointer;font-weight:700;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;touch-action:manipulation}

.popup-dist{background:rgba(59,130,246,.25);color:#93c5fd;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(147,197,253,.4)}
.popup-speed{background:rgba(234,88,12,.3);color:#fdba74;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(253,186,116,.5);letter-spacing:.02em}

.popup-exactname{background:rgba(220,38,38,.3);color:#fecaca;padding:3px 6px;border-radius:5px;font-weight:800;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.5);letter-spacing:.02em}

.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}

.threat-wrap{position:relative;width:28px;height:28px}
.threat-rotate{position:absolute;inset:0;transform-origin:center center;will-change:transform}
.threat-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 5px rgba(0,0,0,.5));transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite;transition:filter .3s ease}
.threat-icon svg{width:24px;height:24px;display:block}

.threat-icon.confirm-5{filter:drop-shadow(0 0 14px rgba(250,204,21,1));animation:cPulse 1s ease-in-out infinite}

.threat-icon.falling svg path,.threat-icon.falling svg polygon,.threat-icon.falling svg rect{fill:#dc2626!important;stroke:#7f1d1d!important}
.threat-icon.stale{opacity:.55;filter:grayscale(.4)}
.threat-icon.threat-pulse{animation:threatPulse 1s ease-in-out infinite}
@keyframes threatPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.55}}
.threat-icon.strat-pulse{animation:stratIconPulse 1.8s ease-in-out infinite}
@keyframes stratIconPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(234,88,12,.8));opacity:1}50%{filter:drop-shadow(0 0 14px rgba(234,88,12,1));opacity:.7}}
.threat-icon.uav-siren{animation:uavSirenPulse .7s ease-in-out infinite}

.threat-icon.ballistic-alarm{animation:ballisticAlarmPulse .5s ease-in-out infinite}
@keyframes ballisticAlarmPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(220,38,38,1))}50%{transform:scale(1.2);filter:drop-shadow(0 0 16px rgba(220,38,38,1));opacity:.75}}
.threat-icon.priority-star::after{content:"⭐";position:absolute;top:-10px;left:-6px;font-size:11px;filter:drop-shadow(0 0 3px rgba(251,191,36,1))}
.strat-wrap{position:relative}
.strat-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.strat-icon svg{width:28px;height:28px;display:block}

const SETTLEMENT_INDEX=(()=>{
  const norm=s=>s.toLowerCase().replace(/[’`´']/g,"'").replace(/[^\p{L}\p{N}\s'-]/gu," ").replace(/\s+/g," ").trim();
  const cities=[];
  for(const s of KYIV_OBLAST_SETTLEMENTS){
    const rec={name:s[0],lat:s[1],lon:s[2],raion:s[3],type:s[4],norm:norm(s[0]),_chornobyl:/Чорнобиль/i.test(s[3])};
    if(rec.type==="c"||rec.type==="s")cities.push(rec);
  }
  cities.sort((a,b)=>b.norm.length-a.norm.length);
  return{cities,norm};
})();
function findSettlementInText(text){
  if(!text)return null;
  const low=SETTLEMENT_INDEX.norm(text);
  if(!low)return null;
  let best=null;
  for(const s of KYIV_OBLAST_SETTLEMENTS){
    const n=SETTLEMENT_INDEX.norm(s[0]);
    if(n.length<3)continue;
    const idx=low.indexOf(n);
    if(idx<0)continue;
    const before=idx>0?low[idx-1]:" ";
    const after=idx+n.length<low.length?low[idx+n.length]:" ";
    if(!(/[^а-яіїєґa-z0-9]/i.test(before)||before===" "))continue;
    if(!(/[^а-яіїєґa-z0-9]/i.test(after)||after===" "))continue;
    const typeScore=s[4]==="c"?2:(s[4]==="s"?1:0);
    const score=n.length*10+typeScore;
    if(!best||score>best.score||(score===best.score&&idx<best.index)){
      best={key:"settlement:"+n,name:s[0],lat:s[1],lon:s[2],raion:s[3],type:s[4],index:idx,length:n.length,_chornobyl:/Чорнобиль/i.test(s[3]),score};
    }
  }
  return best;
}

function haversineKm(a,b,c,d){const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(c-a),dLon=toR(d-b);const x=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearingBetween(lat1,lon1,lat2,lon2){const φ1=lat1*Math.PI/180,φ2=lat2*Math.PI/180,Δλ=(lon2-lon1)*Math.PI/180;const y=Math.sin(Δλ)*Math.cos(φ2);const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);return(Math.atan2(y,x)*180/Math.PI+360)%360;}

function levenshtein(a,b){a=(a||"").toLowerCase();b=(b||"").toLowerCase();const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c);}return dp[m][n];}

function findKyivAreaInText(text){const low=(text||"").toLowerCase().replace(/[’`´]/g,"'");let best=null;for(const{key,area}of KYIV_AREA_KEYS){if(key.length<3)continue;const idx=low.indexOf(key);if(idx<0)continue;const before=idx>0?low[idx-1]:" ";const after=idx+key.length<low.length?low[idx+key.length]:" ";if(!(/[^а-яіїєґa-z]/i.test(before)||before===" "))continue;if(!(/[^а-яіїєґa-z]/i.test(after)||after===" "))continue;if(!best||idx<best.index||(idx===best.index&&key.length>best.length)){best={key:"kyiv_area:"+area.id,name:area.name,lat:area.lat,lon:area.lng,index:idx,length:key.length,_kyivArea:area};}}return best;}
function findPlaceInOldDict(text){const low=(text||"").toLowerCase().replace(/[’`´]/g,"'");let best=null;for(const key of PLACE_KEYS_BY_LEN){const idx=low.indexOf(key);if(idx<0)continue;const before=idx>0?low[idx-1]:" ";const after=idx+key.length<low.length?low[idx+key.length]:" ";if(!(/[^а-яіїєґa-z]/i.test(before)||before===" "))continue;if(!(/[^а-яіїєґa-z]/i.test(after)||after===" "))continue;if(!best||idx<best.index)best={key,name:PLACES[key][2],lat:PLACES[key][0],lon:PLACES[key][1],index:idx,length:key.length};}return best;}
function findPlaceInText(text){const s=findSettlementInText(text);if(s)return s;const e=findExtraPlace(text);if(e)return e;const k=findKyivAreaInText(text);if(k)return k;return findPlaceInOldDict(text);}
function findPlaceFuzzy(text,th=0.7){
  if(!text)return null;
  const exact=findPlaceInText(text);if(exact)return exact;
  const low=normalize(text);let best=null,bestS=0;
  const cands=[];
  for(const s of KYIV_OBLAST_SETTLEMENTS)cands.push({key:"s:"+s[0],name:s[0],lat:s[1],lon:s[2],norm:SETTLEMENT_INDEX.norm(s[0])});
  for(const a of kyivAreas)cands.push({key:"area:"+a.id,name:a.name,lat:a.lat,lon:a.lng,norm:normalize(a.name)});
  for(const c of cands){
    if(c.norm.length<3)continue;
    if(low.includes(c.norm)){if(.95>bestS){bestS=.95;best=c;}continue;}
    const d=levenshtein(low.slice(0,c.norm.length+3),c.norm);
    const sc=1-d/Math.max(low.length,c.norm.length);
    if(sc>=th&&sc>bestS){bestS=sc;best=c;}
  }
  if(!best)return null;
  return{key:best.key,name:best.name,lat:best.lat,lon:best.lon,fuzzyScore:Math.round(bestS*100)/100,_fuzzy:true};
}

/* CLASSIFIER */
const CLASSIFIER=(()=>{
  const HARD=[
    {re:/ту-?\s*95|ту-?\s*160|ту-?\s*22|стратег[іи]чн|стратегическ/i,type:"strategic_aviation",label:"Стратег. авіація",isStrategic:true},
    {re:/а-?50\s?у/i,type:"awacs",label:"А-50У",isAwacs:true},
    {re:/циркон|zircon|3м22|3m22/i,type:"zircon",label:"Циркон",isMissile:true,isZircon:true},
    {re:/реактивн[а-яіїєґ]*\s*(шахед|геран|бпла|дрон)/i,type:"jet_drone",label:"Реакт. БПЛА",isJetDrone:true},
    {re:/ум[пб]б/i,type:"umpb",label:"УМПБ-5",isMissile:true},
    {re:/мгкр|мг\s*кр|бандерол|s\s*[-]?\s*8000/i,type:"banderol",label:"S8000",isMissile:true},
    {re:/герань\s*-?\s*5|geran\s*-?\s*5/i,type:"geran5",label:"Герань-5",isGeran5:true,isGeran:true},
    {re:/герань\s*-?\s*4|geran\s*-?\s*4/i,type:"geran4",label:"Герань-4",isGeran:true},
    {re:/герань\s*-?\s*3|geran\s*-?\s*3/i,type:"geran3",label:"Герань-3",isGeran:true},
    {re:/герань\s*-?\s*2|geran\s*-?\s*2/i,type:"geran2",label:"Герань-2",isGeran:true},
    {re:/балістик|баллистик|кинжал|кінжал|іскандер|искандер|кн-?23/i,type:"ballistic",label:"Бал",isMissile:true},
    {re:/каб\b|kab\b|уаб\b/i,type:"kab",label:"КАБ",isMissile:true},
    {re:/крилат[аиі]?\s+ракет|крилата\s+ракет|х-?\s*101|х-?\s*555|калібр|калибр|kalibr/i,type:"missile",label:"КР",isMissile:true},
    {re:/миг-?31|міг-?31|mig-?31/i,type:"mig31k",label:"МиГ-31К",isMig:true},
    {re:/оникс|ониx|oniks|p-?800/i,type:"missile",label:"Оникс",isMissile:true}
  ];
  const SOFT=[
    {re:/fpv|фпв/i,type:"fpv",label:"FPV"},
    {re:/розвідник|разведчик|recon/i,type:"recon",label:"Розв",isRecon:true},
    {re:/шахед|shahed|герань|geran|бпла|дрон|безпілотник|беспилотник|реактив[а-яіїєґ]*/i,type:"uav",label:"БПЛА"}
  ];
  return function(t){
    t=t||"";
    for(const r of HARD)if(r.isZircon&&r.re.test(t))return{...r,hard:true};
    for(const r of HARD)if(r.isJetDrone&&r.re.test(t))return{...r,hard:true};
    for(const r of HARD)if(r.isGeran&&r.re.test(t))return{...r,hard:true};
    for(const r of HARD)if(!r.isZircon&&!r.isJetDrone&&!r.isGeran&&r.re.test(t))return{...r,hard:true};
    for(const r of SOFT)if(r.re.test(t))return{...r,hard:false};
    return null;
  };
})();

function detectExactName(text){if(!text)return null;const t=text.toLowerCase();let m=t.match(/герань\s*-?\s*([2-5])\b/);if(m)return`Герань-${m[1]}`;m=t.match(/шахед\s*-?\s*(\d{2,3})\b/);if(m)return`Шахед-${m[1]}`;if(/реактивн/.test(t)&&/(шахед|геран|бпла|дрон)/.test(t))return"Реактивний БПЛА";if(/(розвідник|разведчик|recon)/.test(t))return"Розвідник";if(/fpv|фпв/.test(t))return"FPV";m=t.match(/іскандер\s*-?\s*([мк])/i);if(m)return`Іскандер-${m[1].toUpperCase()}`;if(/кинжал|кінжал/.test(t))return"Кинжал";if(/циркон|zircon|3м22/.test(t))return"Циркон";if(/калибр|калібр/.test(t))return"Калібр";m=t.match(/х-?\s*(\d{2,3})/);if(m)return`Х-${m[1]}`;if(/оникс|oniks/.test(t))return"Онікс";return null;}

function buildSettlementsLayer(){
  if(!map||!settlementsLayer)return;
  settlementsLayer.clearLayers();
  settlementMarkers=[];
  const z=map.getZoom();
  if(z<11)return;
  const max=z>=13?9999:(z>=12?400:150);
  let count=0;
  for(const rec of SETTLEMENT_INDEX.cities){
    if(count>=max)break;
    const size=rec.type==="c"?"city":"";
    const icon=L.divIcon({className:"settlement-marker",html:`<div class="settlement-dot ${size}"></div>`,iconSize:[8,8],iconAnchor:[4,4]});
    const m=L.marker([rec.lat,rec.lon],{icon,interactive:false,zIndexOffset:100});
    m.addTo(settlementsLayer);
    settlementMarkers.push(m);
    count++;
  }
}
function updateSettlementsVisibility(){
  if(!map||!settlementsLayer)return;

    if(!map.hasLayer(settlementsLayer))settlementsLayer.addTo(map);

    if(map.hasLayer(settlementsLayer))map.removeLayer(settlementsLayer);

}

/* CHAIN MOVE */
const chainAnimations=new Map();
function animateChainTransition(chainKey,from,to,marker,cls,confirmN,totalW,uncertain,aiLevel,stage,inSiren,hasPriority,isSimulated,onDone){
  const dist=haversineKm(from.lat,from.lon,to.lat,to.lon);
  let dur=dist*CONFIG.CHAIN_TRANSITION_MS_PER_KM;
  dur=Math.max(CONFIG.CHAIN_TRANSITION_MIN_MS,Math.min(CONFIG.CHAIN_TRANSITION_MAX_MS,dur));
  const startTime=Date.now();
  const heading=bearingBetween(from.lat,from.lon,to.lat,to.lon);
  const prev=chainAnimations.get(chainKey);
  if(prev&&prev.rafId)cancelAnimationFrame(prev.rafId);
  const state={from,to,startTime,duration:dur,marker,cls,confirmN,totalW,uncertain,aiLevel,stage,inSiren,hasPriority,isSimulated,heading,onDone,rafId:null};
  chainAnimations.set(chainKey,state);
  function tick(){
    const now=Date.now();
    const t=Math.min(1,(now-startTime)/dur);
    const et=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const lat=from.lat+(to.lat-from.lat)*et;
    const lon=from.lon+(to.lon-from.lon)*et;
    try{
      marker.setLatLng([lat,lon]);
      marker.setIcon(makeIcon(cls,heading,confirmN,totalW,false,uncertain,aiLevel,stage,inSiren,hasPriority,isSimulated));
    }catch(e){}
    if(t<1){state.rafId=requestAnimationFrame(tick);}
    else{chainAnimations.delete(chainKey);if(onDone)try{onDone();}catch(e){}}
  }
  state.rafId=requestAnimationFrame(tick);
}

function parseDistanceFromKyiv(text){if(!text)return null;let m=text.match(/(\d{1,3})\s*км\s+(?:від|от)\s+(?:міста|города|києва|киева|київ|киев)/i);if(m){const v=parseInt(m[1],10);if(v>=0&&v<=500)return v;}return null;}
function parseEtaRange(text){if(!text)return null;let m=text.match(/підл[іi]т[:\s]+(\d{1,2})\s*[-–—]\s*(\d{1,2})\s*хв/i);if(m)return[parseInt(m[1],10),parseInt(m[2],10)];m=text.match(/подл[её]т[:\s]+(\d{1,2})\s*[-–—]\s*(\d{1,2})\s*мин/i);if(m)return[parseInt(m[1],10),parseInt(m[2],10)];return null;}
function parseAltitude(t){if(typeof t.altitude==="number")return Math.round(t.altitude);if(typeof t.alt==="number")return Math.round(t.alt);const text=[t.title,t.explanationShort,t.region,t.locality].filter(Boolean).join(" ");if(!text)return null;let m=text.match(/(?:висот[аіиою]|высот[аеыою])\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*(км|km|м|m)\b/i);if(m){const v=parseFloat(m[1].replace(",","."));const unit=m[2].toLowerCase();const meters=(unit==="км"||unit==="km")?v*1000:v;if(meters>=50&&meters<=20000)return Math.round(meters);}m=text.match(/(\d{3,5})\s*(?:м|m\b)/i);if(m){const v=parseInt(m[1],10);if(v>=50&&v<=20000)return v;}return null;}

function parseEventTime(text,msgDate){if(!text)return null;const msgMs=msgDate?Date.parse(msgDate):null;const msgDateObj=msgMs?new Date(msgMs):null;let m=text.match(/(?:^|\s|[оавОАВуУ])\s*(\d{1,2}):(\d{2})(?:\s|$|,|\.|\))/);if(m){const hh=parseInt(m[1],10),mm=parseInt(m[2],10);if(hh>=0&&hh<=23&&mm>=0&&mm<=59&&msgDateObj){const d=new Date(msgDateObj);d.setHours(hh,mm,0,0);if(d.getTime()>msgMs+5*60*1000)d.setDate(d.getDate()-1);return d.getTime();}}m=text.match(/(\d{1,3})\s*(?:хв|мин|min)\s*(?:назад|тому|раніше|ранее)/i);if(m)return(msgMs||Date.now())-parseInt(m[1],10)*60*1000;return null;}
function parsePlaceAndAltitude(text){if(!text)return null;let raw=String(text).trim();if(!raw||raw.length>60)return null;raw=raw.replace(/^[•·\-–—\s]+/,"").replace(/[\s]+$/,"");const m=raw.match(/^([А-ЯІЇЄҐа-яіїєґ'’\-][А-ЯІЇЄҐа-яіїєґ'’\-\s]{1,30}?)\s+(\d{1,5})\s*$/i);if(!m)return null;const placeName=m[1].trim(),altRaw=parseInt(m[2],10);let alt=null;if(altRaw>=500&&altRaw<=15000)alt=altRaw;else if(altRaw>=1&&altRaw<=15)alt=altRaw*1000;if(!alt)return null;const place=findPlaceInText(placeName);return place?{place,altitude:alt}:null;}

function showTopAlertForImpact(report,place,text){

function detectStrategicActivity(text,ch,msgMs){
  if(!text)return;
  const found=[];
  for(const key of Object.keys(STRATEGIC_TYPES)){
    const tm=STRATEGIC_TYPES[key];
    if(tm.re.test(text)){
      const airport=findStrategicAirport(text);
      if(airport){
        const countMatch=text.match(new RegExp(`(\\d+)\\s*[хx×]?\\s*борт[іи]?\\s*(?:${tm.re.source})`,tm.re.flags+"i"));
        const count=countMatch?parseInt(countMatch[1],10):1;
        found.push({typeMeta:tm,count,airport,isTraining:/тренуванн|навчальн|учбов/i.test(text),sampleText:text});
      }
    }
  }
  const reDisloc=/(?:передислокац[іия]|перекиданн|переброск)\s+(\d+)\s*[хx×]?\s*борт[іи]?\s*(Ту-?\s*22м?3?|Ту-?\s*95|Ту-?\s*160)\s+з\s+аеродрому\s*«?([А-Яа-яЁёЇїІіЄєҐґ\-]+)»?\s+на\s+аеродром\s*«?([А-Яа-яЁёЇїІіЄєҐґ\-]+)»?/i;
  let md=reDisloc.exec(text);
  if(md){
    const toAirport=STRATEGIC_AIRPORTS.find(a=>a.re.test(md[4]));
    const tm=Object.values(STRATEGIC_TYPES).find(t=>t.re.test(md[2]));
    if(toAirport&&tm)found.push({typeMeta:tm,count:parseInt(md[1],10),airport:toAirport,isTraining:true,sampleText:text});
  }
  const reBast=/(\d+)\s*берегових\s*ракетних\s*комплекс[ів]*\s*«?Бастіон»?/i;
  const mB=reBast.exec(text);
  if(mB){
    const count=parseInt(mB[1],10);
    const salvo=count*2;
    strategicActivity.set("bastion",{count,place:"Курськ/Міллєрово",salvo,lastSeen:msgMs,channels:new Set([ch])});
    if(isPriorityChannel(ch)||channelWeight(ch)>=1.3)triggerBallisticAlarm("bastion:"+ch);
  }
  const reIsk=/(\d+)\s*оперативно\s*тактичних\s*ракетних\s*установ[ок]*\s*«?Іскандер»?/i;
  const mI=reIsk.exec(text);
  if(mI){
    const count=parseInt(mI[1],10);
    const salvo=count*2;
    strategicActivity.set("iskander",{count,place:"Вороніж",salvo,lastSeen:msgMs,channels:new Set([ch])});
    if(isPriorityChannel(ch)||channelWeight(ch)>=1.3)triggerBallisticAlarm("iskander:"+ch);
  }
  if(/загроза\s+(циркон|онікс|цирконів|оніксів)/i.test(text)&&/курс/i.test(text)){
    strategicActivity.set("zircon_kursk",{place:"Курськ",lastSeen:msgMs,channels:new Set([ch])});
    if(isPriorityChannel(ch)||channelWeight(ch)>=1.3)triggerBallisticAlarm("zircon_kursk:"+ch);
  }
  if(/каспій|каспий/i.test(text)&&/(калібр|калибр|х-?\s*101)/i.test(text)){
    strategicActivity.set("caspian_calibr",{place:"Каспійське море",lastSeen:msgMs,channels:new Set([ch])});
  }
  if(/су-?\s*30/i.test(text)&&/(білорус|беларус|мозир)/i.test(text)){
    const airport={key:"su30_belarus",name:"Білорусь (Мозир)",lat:52.05,lon:29.27,region:"Білорусь"};
    const tm=STRATEGIC_TYPES.SU30;
    found.push({typeMeta:tm,count:1,airport,isTraining:false,sampleText:text,special:true});
  }
  for(const f of found){
    const key=`strat|${f.typeMeta.type}|${f.airport.key}|${f.isTraining?"train":"combat"}`;
    const existing=strategicActivity.get(key);
    if(existing){
      existing.count=Math.max(existing.count,f.count);
      existing.lastSeen=msgMs;
      existing.channels.add(ch);
      if(!f.isTraining)existing.isTraining=false;
      existing.sampleText=f.sampleText;
      upsertStrategicMarker(existing);
    }else{
      const item={key,...f,lastSeen:msgMs,channels:new Set([ch])};
      strategicActivity.set(key,item);
      upsertStrategicMarker(item);
    }
  }
  rebuildStrategicPanel();
}

function initAudio(){if(audioCtx)return audioCtx;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();startKeepAlive();}catch(e){audioCtx=null;}return audioCtx;}
function startKeepAlive(){if(keepAliveInterval)return;keepAliveInterval=setInterval(()=>{if(!audioCtx)return;try{if(audioCtx.state==="suspended"){audioCtx.resume().catch(()=>{});return;}const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.setValueAtTime(1,audioCtx.currentTime);g.gain.setValueAtTime(0.00001,audioCtx.currentTime);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.05);}catch(e){}},20000);}
function unlockAudio(){const c=initAudio();if(c&&c.state==="suspended")c.resume().catch(()=>{});}
function playBell(){if(!audioCtx)return;const now=audioCtx.currentTime;[{f:880,g:.30,d:1.1},{f:1760,g:.14,d:.7},{f:2640,g:.07,d:.45}].forEach(p=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.setValueAtTime(p.f,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(p.g,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+p.d);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+p.d+.05);});}
function playAlertSound(force){if(!CONFIG.SOUND_ENABLED)return;const now=Date.now();if(!force&&now-lastSoundAt<CONFIG.SOUND_COOLDOWN_MS)return;lastSoundAt=now;const c=initAudio();if(!c)return;try{if(c.state==="suspended")c.resume();playBell();}catch(e){}}
function playSirenOnce(dur=3000){const c=initAudio();if(!c)return;if(c.state==="suspended")c.resume();const n=c.currentTime,d=dur/1000;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type="sawtooth";o.frequency.setValueAtTime(440,n);o.frequency.linearRampToValueAtTime(880,n+d*.25);o.frequency.linearRampToValueAtTime(660,n+d*.6);o.frequency.linearRampToValueAtTime(440,n+d);f.type="bandpass";f.frequency.value=800;f.Q.value=3;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(.35,n+.1);g.gain.setValueAtTime(.35,n+d-.15);g.gain.linearRampToValueAtTime(.0001,n+d);o.connect(f);f.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05);}
function flashSirenBtn(d){const b=$("sirenBtn");if(!b)return;b.classList.add("active");if(sirenActiveTimeout)clearTimeout(sirenActiveTimeout);sirenActiveTimeout=setTimeout(()=>b.classList.remove("active"),d||3000);}
function triggerSirenSequence(dur=3000,times=1){const n=Math.max(1,times||1);flashSirenBtn(dur*n+(n-1)*250);for(let i=0;i<n;i++)setTimeout(()=>playSirenOnce(dur),i*(dur+250));}
function isRocketType(type){return CONFIG.ROCKET_TYPES.has(type);}
function fireSirenForTarget(key,clsLike,ch){if(!clsLike)return false;if(!CONFIG.SOUND_TYPE_FILTER.has(clsLike.type)&&!clsLike.isGeran5)return false;if(ch&&!isPriorityChannel(ch))return false;const now=Date.now();const last=firedSoundKeys.get(key)||0;const win=isRocketType(clsLike.type)?CONFIG.SOUND_NEAR_WINDOW_MS_ROCKET:CONFIG.SOUND_NEAR_WINDOW_MS;if(now-last<win)return false;firedSoundKeys.set(key,now);if(firedSoundKeys.size>300){const cutoff=now-10*60*1000;for(const[k,t]of firedSoundKeys)if(t<cutoff)firedSoundKeys.delete(k);}playAlertSound(true);return true;}

  function moderate(t){t=(t||"").trim();if(!t||EMPTY_RE.test(t))return{ok:false,reason:"пустое",spamScore:1};if(t.length<8)return{ok:false,reason:"коротко",spamScore:.8};return{ok:true,reason:"",spamScore:0};}
  function score(ctx){
    const now=Date.now();const ageMin=Math.max(0,(now-(ctx.firstSeen||now))/60000);
    const channels=ctx.channels instanceof Set?ctx.channels:new Set(ctx.channels||[]);
    const chWeight=[...channels].reduce((s,c)=>s+channelWeight(c),0);
    const chAvg=channels.size?chWeight/channels.size:0;
    const chScore=Math.min(chAvg/2,1);const confScore=Math.min(channels.size/4,1);
    const freshScore=Math.max(0,1-ageMin/30);
    const geoScore=(ctx.place&&ctx.place.lat!=null&&!ctx.place._areaOnly)?1:.3;
    const hardScore=(ctx.cls&&ctx.cls.hard)?1:.4;const targetScore=ctx.target?1:.2;
    const total=W.channel*chScore+W.confirmations*confScore+W.freshness*freshScore+W.hasCoords*geoScore+W.hardClassifier*hardScore+W.hasTarget*targetScore;
    let level="low";if(total>=LEVELS.critical)level="critical";else if(total>=LEVELS.high)level="high";else if(total>=LEVELS.medium)level="medium";
    return{total:Math.round(total*100)/100,level};
  }
  const LEVEL_META={critical:{color:"#fecaca",bg:"rgba(220,38,38,.35)",border:"#dc2626",label:"КРИТИЧНО"},high:{color:"#fed7aa",bg:"rgba(234,88,12,.3)",border:"#ea580c",label:"ВЫСОКАЯ"},medium:{color:"#fef08a",bg:"rgba(202,138,4,.3)",border:"#ca8a04",label:"СРЕДНЯЯ"},low:{color:"#cbd5e1",bg:"rgba(148,163,184,.2)",border:"#94a3b8",label:"НИЗКАЯ"}};
  function badgeHtml(r){if(!r)return"";const m=LEVEL_META[r.level]||LEVEL_META.low;return`<div class="ai-badge" style="background:${m.bg};color:${m.color};border-color:${m.border}">🤖 ${m.label} · ${Math.round(r.total*100)}%</div>`;}
  return{score,moderate,badgeHtml,LEVEL_META};
})();

function appendTrailPoint(chainKey,cls,point,channel,msgMs){
  let chain=trails.get(chainKey);
  if(chain){
    const last=chain.points[chain.points.length-1];
    const age=msgMs-chain.lastSeen;
    const dist=last?haversineKm(last.lat,last.lon,point.lat,point.lon):0;
    if(age>CONFIG.TRAIL_MAX_AGE_MS||dist>CONFIG.TRAIL_MAX_GAP_KM){closeTrail(chainKey);chain=null;}
  }
  if(!chain){
    chain={cls,points:[],firstSeen:msgMs,lastSeen:msgMs,channels:new Set(),markerRef:null,aiResult:null,polyline:null,speedKmh:resolveSpeedKmh(cls.type,point.sampleText||""),exactName:point.exactName||null,_infra:!!point._infra,_chornobyl:!!point._chornobyl,_key:chainKey};
    trails.set(chainKey,chain);
  }
  const last=chain.points[chain.points.length-1];
  const isNewPoint=!last||haversineKm(last.lat,last.lon,point.lat,point.lon)>0.1;
  if(isNewPoint){
    chain.points.push({...point,t:msgMs,channel});
    if(chain.points.length>CONFIG.TRAIL_MAX_POINTS)chain.points.shift();
  }
  chain.channels.add(channel);
  chain.lastSeen=msgMs;
  if(point.exactName&&!chain.exactName)chain.exactName=point.exactName;
  if(point._infra)chain._infra=true;
  if(point._chornobyl)chain._chornobyl=true;
  if(chain.markerRef&&chain.polyline)try{chain.polyline.setLatLngs(chain.points.map(p=>[p.lat,p.lon]));}catch(e){}
  return{chain,isNewPoint};
}

function extractLaunchStage(text){
  if(!text)return[];
  if(NON_AIR_CONTEXT_RE.test(text))return[];
  if(CLEAR_RE.test(text))return[];
  const cls=CLASSIFIER(text);
  if(!cls||!cls.hard)return[];
  if(cls.isStrategic){
    const isReady=READY_RE.test(text);
    const isLaunch=LAUNCH_RE.test(text)&&!/без\s+пуск|поки\s+що\s+без/i.test(text);
    if(!isReady&&!isLaunch)return[];
    const bases=findStrategicAirbases(text);
    const count=parseAircraftCount(text);
    const list=bases.length>0?bases:[{key:"unknown",name:"аеродром не вказано",lat:null,lon:null,region:""}];
    return list.map(b=>({kind:"strategic",key:"strat_"+b.key,name:b.name,region:b.region,lat:b.lat,lon:b.lon,cls,stage:"ready",target:null,count}));
  }
  if(cls.isAwacs)return[];
  if(OBSERVATION_TYPES.has(cls.type)){
    if(NO_LAUNCH_RE.test(text))return[];
    const obs=getObservedPlace(text);
    const tgt=getTargetPlace(text);
    const place=obs||tgt;
    if(!place)return[];
    return[{kind:"observation",key:"obs_"+place.key+"_"+cls.type,name:place.name,region:"",lat:place.lat,lon:place.lon,cls,stage:null,target:tgt,count:null}];
  }
  if(NO_LAUNCH_RE.test(text)&&!/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text))return[];
  const hasLaunch=LAUNCH_RE.test(text);
  const hasThreat=THREAT_RE.test(text);
  let stage=null;
  if(hasLaunch)stage="launch";
  else if(hasThreat)stage="threat";
  else{if(["uav","geran2","geran3","geran4","geran5","jet_drone","recon","missile","zircon"].includes(cls.type))stage="threat";else return[];}
  if(stage!=="launch"&&(cls.isJetDrone||["missile","banderol","geran2","geran3","geran4","geran5","zircon"].includes(cls.type))){
    if(!ACTION_RE.test(text))return[];
  }
  if(cls.isMig){
    const base=findMigAirbase(text);
    if(!base)return[];
    return[{kind:"mig",key:"mig_"+base.key,name:base.name,region:base.region,lat:base.lat,lon:base.lon,cls,stage:"takeoff",target:null}];
  }
  const tgt=getTargetPlace(text);
  const res=[];
  const origins=findLaunchOriginsInText(text);
  for(const o of origins)res.push({kind:"origin",key:o.key,name:o.name,region:o.region,lat:o.lat,lon:o.lon,cls,stage,target:tgt});
  const region=findRegionInText(text);
  if(region&&origins.length===0)res.push({kind:"region",key:region.key,name:region.name,region:region.name,lat:region.lat,lon:region.lon,cls,stage,target:tgt});
  return res;
}
function extractPlaceAndType(text){
  if(!text)return null;
  if(NON_AIR_CONTEXT_RE.test(text))return null;
  if(CLEAR_RE.test(text))return null;
  if(NO_LAUNCH_RE.test(text)&&!/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text))return null;
  const oblastCount=(text.match(/[А-ЯІЇЄҐ][а-яіїєґ]+щин[аиіу]:/gi)||[]).length;
  if(oblastCount>=2)return null;
  const cls=CLASSIFIER(text);
  if(!cls)return null;
  if(cls.isStrategic||cls.isMig||cls.isAwacs)return null;
  if(OBSERVATION_TYPES.has(cls.type))return null;
  const obs=getObservedPlace(text);
  const tgt=getTargetPlace(text);
  let place=null,isApproach=false;
  if(obs)place=obs;
  else if(tgt){
    const src=nearestRussianOrigin(tgt.lat,tgt.lon);
    let hdg;
    if(src.origin&&src.dist>CONFIG.TRAIL_MIN_ORIGIN_DIST_KM)hdg=bearingBetween(src.origin.lat,src.origin.lon,tgt.lat,tgt.lon);
    else hdg=bearingBetween(51.73,36.19,tgt.lat,tgt.lon);
    const[lat,lon]=destPoint(tgt.lat,tgt.lon,(hdg+180)%360,CONFIG.APPROACH_OFFSET_KM);
    place={key:"approach_"+tgt.key,name:tgt.name,lat,lon,index:0,length:0,_approach:true};
    isApproach=true;
  }else{
    const sentences=text.split(/[.!?\n]+/);
    for(const s of sentences){
      const sentence=s.trim();
      if(!sentence)continue;
      if(!cls.re.test(sentence))continue;
      const rawPlace=findPlaceFuzzy(sentence)||findPlaceInText(sentence);
      if(rawPlace){
        const idx=text.indexOf(sentence);
        place={key:rawPlace.key,name:rawPlace.name,lat:rawPlace.lat,lon:rawPlace.lon,index:idx+rawPlace.index,length:rawPlace.length,_kyivArea:rawPlace._kyivArea,_fuzzy:rawPlace._fuzzy,fuzzyScore:rawPlace.fuzzyScore,_infra:rawPlace._infra,_chornobyl:rawPlace._chornobyl};
        break;
      }
    }
  }
  if(!place)return null;
  const windowStart=Math.max(0,place.index-200);
  const windowEnd=Math.min(text.length,place.index+place.length+200);
  const sentence2=text.slice(windowStart,windowEnd);
  const localPlaceIndex=Math.max(0,place.index-windowStart);
  const typeRegex=new RegExp(cls.re.source,cls.re.flags);
  const typeMatch=typeRegex.exec(sentence2);
  if(!typeMatch)return null;
  const pEnd=localPlaceIndex+place.length;
  const tStart=typeMatch.index;
  const tEnd=tStart+typeMatch[0].length;
  const gap=pEnd<=tStart?(tStart-pEnd):(localPlaceIndex-tEnd);
  if(gap<0||gap>250)return null;
  if(!cls.hard&&!ACTION_RE.test(sentence2))return null;
  return{place,cls,target:tgt,isApproach};
}
function extractImpact(text){
  if(!text)return null;
  if(NON_AIR_CONTEXT_RE.test(text))return null;
  const oblastCount=(text.match(/[А-ЯІЇЄҐ][а-яіїєґ]+щин[аиіу]:/gi)||[]).length;
  if(oblastCount>=2)return null;
  const im=IMPACT_RE.exec(text);
  if(!im)return null;
  const place=findPlaceInText(text);
  if(place&&Math.abs(place.index-im.index)<=120){
    if(TOO_GENERIC_PLACES.has(place.key)){
      const w=text.slice(Math.max(0,place.index-30),place.index+place.key.length+30);
      if(!/·|район|мікрорайон|масив|берег/i.test(w))return null;
    }
    return{target:{key:place.key,name:place.name,lat:place.lat,lon:place.lon,_kyivArea:place._kyivArea,_infra:place._infra,_chornobyl:place._chornobyl}};
  }
  const region=findRegionInText(text);
  if(region){
    const rm=region.re.exec(text);
    if(rm&&Math.abs(rm.index-im.index)<=120)return{target:{key:region.key,name:region.name,lat:region.lat,lon:region.lon}};
  }
  return null;
}

/* Simulate track movement */
function simulateMsgTrack(o,key){
  if(o._sim)return;
  o._sim=true;
  const kmPerSec=(o.speed||180)/3600;
  o._simTimer=setInterval(()=>{
    if(!o.marker){clearInterval(o._simTimer);return;}
    const ll=o.marker.getLatLng();if(!ll)return;
    const d=haversineKm(ll.lat,ll.lng,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    const th=soundThresholdFor(o.cls.type);
    if(d<=th&&!o._sirenFired){o._sirenFired=true;maybeSirenForPlace(key,o.cls,ll.lat,ll.lng,o.priorityChannel);}
    if(d<1.2){
      clearInterval(o._simTimer);
      const isFuzzy=!!o.place?._fuzzy;
      if(msgThreatLayer)try{msgThreatLayer.removeLayer(o.marker);}catch(e){}
      msgMarkers.delete(key);
      if(isFuzzy||!o.place){
        const mkKey="unk_"+Date.now();
        const mk=L.marker([ll.lat,ll.lng],{icon:impactBigIcon("unknown"),zIndexOffset:1500});
        mk.bindPopup(`<div class="popup-title type-impact">❓ Точка прильоту невідома</div>
          <div class="popup-meta">Приблизно: ${ll.lat.toFixed(3)}, ${ll.lng.toFixed(3)}<br>Час: ${new Date().toLocaleTimeString("uk-UA")}</div>
          <button type="button" class="popup-remove-btn" data-remove-kind="impactMarker" data-remove-key="${esc(mkKey)}">🗑 Видалити маркер</button>`,CONFIG.POPUP_OPTS);
        mk.addTo(impactLayer);
        impactMarkers.set(mkKey,{marker:mk,lastSeen:Date.now(),eventAt:Date.now(),cls:o.cls,kind:"unknown"});
        setTimeout(()=>{try{impactLayer.removeLayer(mk);}catch(e){}impactMarkers.delete(mkKey);},CONFIG.ARRIVAL_UNKNOWN_TTL_MS);
      }else{
        const impKey="imp_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
        const mk=L.marker([ll.lat,ll.lng],{icon:impactSmallIcon(),zIndexOffset:2000});
        mk.bindPopup(`<div class="popup-title type-impact">💥 ${esc(o.cls._exactName||o.cls.label||"Вибух")}</div>
          <div class="popup-meta">Приліт: ${ll.lat.toFixed(3)}, ${ll.lng.toFixed(3)}<br>Час: ${new Date().toLocaleTimeString("uk-UA")}</div>
          <button type="button" class="popup-remove-btn" data-remove-kind="impactMarker" data-remove-key="${esc(impKey)}">🗑 Видалити маркер</button>`,CONFIG.POPUP_OPTS);
        mk.addTo(impactLayer);
        impactMarkers.set(impKey,{marker:mk,lastSeen:Date.now(),eventAt:Date.now(),cls:o.cls,kind:"arrival"});
        setTimeout(()=>{try{impactLayer.removeLayer(mk);}catch(e){}impactMarkers.delete(impKey);},CONFIG.IMPACT_TTL_MS);
      }
      if(o.chainKey)closeTrail(o.chainKey);
      scheduleFeedUpdate();
      return;
    }
    const brg=bearingBetween(ll.lat,ll.lng,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    const[nlat,nlon]=destPoint(ll.lat,ll.lng,brg,kmPerSec);
    o.marker.setLatLng([nlat,nlon]);
    o.heading=brg;
    o.marker.setIcon(makeIcon(o.cls,brg,o.confirmN,totalWeightOf(o.channels),false,!!o.place?._fuzzy,null,null,d<=th,o.hasPriority,o.isSimulated));
  },1000);
}

/* Главный sync */
function syncMessageThreats(messages){
  const now=Date.now();
  const candidates=new Map();
  const impacts=new Map();
  for(let i=0;i<(messages||[]).length;i++){
    const m=messages[i];
    const text=m.text||"";
    const ch=(m.channel||"unknown").replace(/^@/,"").toLowerCase();
    const msgMs=m.date?Date.parse(m.date):now;
    if(!AI.moderate(text).ok)continue;
    detectStrategicActivity(text,ch,msgMs);
    tryTriggerAlarmFromChannel(ch,text);
    const warns=detectThreatWarnings(text);
    for(const w of warns)upsertWarning(w,ch,msgMs);
    processImpactReport(text,ch,msgMs);
    const isAltCh=isAltitudeChannel(ch);
    if(isAltCh){
      const pa=parsePlaceAndAltitude(text);
      if(pa){
        const key="pa|"+pa.place.key;
        if(!candidates.has(key))candidates.set(key,{kind:"place",place:pa.place,cls:{type:"uav",label:"БПЛА",hard:false},target:null,altitudeOverride:pa.altitude,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text});
        const c=candidates.get(key);c.channels.add(ch);if(msgMs<c.firstSeen)c.firstSeen=msgMs;if(msgMs>c.lastSeen)c.lastSeen=msgMs;c.altitudeOverride=pa.altitude;c.sampleText=text;
        lastPlaceByChannel[ch]=key;continue;
      }
      const justAlt=isJustAltitude(text);
      if(justAlt!=null){
        const lastKey=lastPlaceByChannel[ch];
        if(lastKey&&candidates.has(lastKey)){const c2=candidates.get(lastKey);c2.altitudeOverride=justAlt;c2.lastSeen=msgMs;c2.channels.add(ch);}
        continue;
      }
    }
    const launches=extractLaunchStage(text);
    if(launches.length>0){
      for(const L of launches){
        const key=`reg|${L.key}|${L.cls.type}|${L.stage||"obs"}`;
        if(!candidates.has(key))candidates.set(key,{kind:L.kind,origin:L,cls:L.cls,stage:L.stage,region:{key:L.key,name:L.name,lat:L.lat,lon:L.lon},target:L.target,count:L.count||null,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text,exactName:detectExactName(text)});
        const c=candidates.get(key);c.channels.add(ch);if(msgMs<c.firstSeen)c.firstSeen=msgMs;if(msgMs>c.lastSeen)c.lastSeen=msgMs;if(text.length<c.sampleText.length)c.sampleText=text;if(L.count&&(!c.count||L.count>c.count))c.count=L.count;
      }
      continue;
    }
    const extracted=extractPlaceAndType(text);
    if(extracted){
      const{place,cls,target,isApproach}=extracted;
      const key=`msg|${place.key}|${cls.type}`;
      const exactName=detectExactName(text);
      if(!candidates.has(key))candidates.set(key,{kind:"place",place,cls,target,isApproach:!!isApproach,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text,exactName});
      const c=candidates.get(key);c.channels.add(ch);if(msgMs<c.firstSeen)c.firstSeen=msgMs;if(msgMs>c.lastSeen)c.lastSeen=msgMs;if(text.length<c.sampleText.length)c.sampleText=text;if(exactName&&!c.exactName)c.exactName=exactName;
      continue;
    }
    const impact=extractImpact(text);
    if(impact){
      const key=`imp|${impact.target.key}`;
      if(!impacts.has(key))impacts.set(key,{target:impact.target,channels:new Set(),eventAt:null,lastSeen:msgMs,sampleText:text});
      const c=impacts.get(key);c.channels.add(ch);
      const evt=parseEventTime(text,m.date);if(evt&&(!c.eventAt||evt>c.eventAt))c.eventAt=evt;
      if(msgMs<c.lastSeen)c.lastSeen=msgMs;
      if(text.length<c.sampleText.length)c.sampleText=text;
    }
  }

  for(const[key,c]of candidates){
    if(isDismissed(key))continue;
    const confirmN=c.channels.size;
    const totalW=totalWeightOf(c.channels);
    const hasPrio=hasPrioritySource(c.channels);
    const isThreatSolo=c.stage==="threat"&&confirmN<CONFIG.MIN_CHANNELS_CONFIRM;
    const isMig=c.cls&&c.cls.isMig;
    const isStrategic=c.cls&&c.cls.isStrategic;
    const isAwacs=c.cls&&c.cls.isAwacs;
    const isObservation=c.cls&&OBSERVATION_TYPES.has(c.cls.type);
    const isCriticalBallistic=c.cls&&(c.cls.type==="ballistic"||c.cls.type==="zircon");
    const age=now-c.firstSeen;
    const isAltitudeMsg=c.altitudeOverride!=null;
    const minConfirm=hasPrio?1:CONFIG.MIN_CHANNELS_CONFIRM;
    if(isStrategic){if(confirmN<1)continue;}
    else if(isMig){if(confirmN<1)continue;if(age>CONFIG.STALE_MSG_MS)continue;}
    else if(isAwacs)continue;
    else if(isAltitudeMsg){if(age>CONFIG.STALE_MSG_MS)continue;}
    else if(isObservation){if(confirmN<minConfirm)continue;if(age>CONFIG.STALE_MSG_MS)continue;}
    else if(isCriticalBallistic){}
    else if(hasPrio){}
    else if(isThreatSolo){if(age>CONFIG.LAUNCHER_SOLO_TTL_MS)continue;}
    else if(confirmN<minConfirm)continue;
    else if(totalW<2.0)continue;
    const aiResult=AI.score({channels:c.channels,firstSeen:c.firstSeen,place:c.place||c.region,cls:c.cls,target:c.target});

    if(c.kind==="strategic"){
      const{region,cls,origin,count}=c;
      if(region.lat!=null&&region.lon!=null){
        const fakeThreat={type:cls.type,_altitude:null,_falling:false,_count:count||null};
        const marker=L.marker([region.lat,region.lon],{icon:makeIcon(fakeThreat,null,confirmN,totalW,false,false,aiResult.level,"ready",false,hasPrio,false),zIndexOffset:930});
        marker.bindPopup(`<div class="popup-title type-${cls.type}">Стратегічна авіація</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b>${count?`<br>Бортів: <b>${count}</b>`:""}</div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`,CONFIG.POPUP_OPTS);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,stage:"ready",hasPriority:hasPrio,exactName:c.exactName});
      }
      continue;
    }
    if(c.kind==="mig"){
      const{region,cls,origin}=c;
      if(region.lat==null||region.lon==null)continue;
      const eta=etaToKyivMin(region.lat,region.lon,cls.type);
      const marker=L.marker([region.lat,region.lon],{icon:makeIcon(cls,null,confirmN,totalW,false,false,aiResult.level,"takeoff",false,hasPrio,false),zIndexOffset:935});
      marker.bindPopup(`<div class="popup-title type-${cls.type}">МиГ-31К · зліт</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Підтверджень: <b>${confirmN}</b>${eta!=null?`<br>Підліт: <b>${formatEta(eta)}</b>`:""}</div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`,CONFIG.POPUP_OPTS);
      marker.addTo(msgThreatLayer);
      if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
      msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,stage:"takeoff",eta,hasPriority:hasPrio,exactName:c.exactName});
      continue;
    }
    if(c.kind==="observation"){
      const{cls,target}=c;
      const place=c.origin||c.region;
      let arrowBearing=0;
      if(target)arrowBearing=bearingBetween(place.lat,place.lon,target.lat,target.lon);
      else arrowBearing=bearingBetween(place.lat,place.lon,CONFIG.KYIV[0],CONFIG.KYIV[1]);
      const chainKey=`${cls.type}|obs|${(target&&target.key)||place.key}`;
      const{chain,isNewPoint}=appendTrailPoint(chainKey,cls,{lat:place.lat,lon:place.lon,name:place.name,exactName:c.exactName},ch,msgMs);
      chain.aiResult=aiResult;
      const last=chain.points[chain.points.length-1];
      const eta=etaToKyivMin(place.lat,place.lon,cls.type);
      let markerRef=chain.markerRef;
      if(markerRef&&markerRef.marker){
        const cur=markerRef.marker.getLatLng();
        const needAnim=isNewPoint&&haversineKm(cur.lat,cur.lng,last.lat,last.lon)>0.05;
        if(needAnim){
          animateChainTransition(chainKey,{lat:cur.lat,lon:cur.lng},{lat:last.lat,lon:last.lon},markerRef.marker,cls,confirmN,totalW,false,aiResult.level,null,false,hasPrio,false,()=>{
            markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
          });
        }else{
          markerRef.marker.setLatLng([last.lat,last.lon]);
          markerRef.marker.setIcon(makeIcon(cls,arrowBearing,confirmN,totalW,false,false,aiResult.level,null,false,hasPrio,false));
          markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
        }
      }else{
        const marker=L.marker([last.lat,last.lon],{icon:makeIcon(cls,arrowBearing,confirmN,totalW,false,false,aiResult.level,null,false,hasPrio,false),zIndexOffset:900});
        marker.bindPopup(buildTrailPopupHtml(chain),CONFIG.POPUP_OPTS);
        marker.addTo(msgThreatLayer);
        marker.on("popupopen",()=>openTrail(chainKey));
        marker.on("popupclose",()=>closeTrailDrawing(chainKey));
        markerRef={marker,trailPoints:null};chain.markerRef=markerRef;
      }
      msgMarkers.set(key,{marker:markerRef.marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place,chainKey,eta,hasPriority:hasPrio,exactName:c.exactName});
      maybeSirenForPlace(key,cls,place.lat,place.lon,ch);
      continue;
    }
    if(c.kind==="region"||c.kind==="origin"||c.kind==="default"||c.kind==="guess"){
      const{region,cls,stage,origin,target}=c;
      if(!inZone(region.lat,region.lon))continue;
      const eta=etaToKyivMin(region.lat,region.lon,cls.type);
      if(stage==="launch"){
        const targetBearing=target?bearingBetween(region.lat,region.lon,target.lat,target.lon):bearingBetween(region.lat,region.lon,50.45,30.52);
        const fakeThreat={type:cls.type,_altitude:null,_falling:false,heading:targetBearing};
        const marker=L.marker([region.lat,region.lon],{icon:makeIcon(fakeThreat,targetBearing,confirmN,totalW,false,false,aiResult.level,stage,false,hasPrio,false),zIndexOffset:950});
        marker.bindPopup(`<div class="popup-title type-${cls.type}">ПУСК · ${cls.label}</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Підтверджень: <b>${confirmN}</b>${eta!=null?`<br>Підліт: <b>${formatEta(eta)}</b>`:""}</div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`,CONFIG.POPUP_OPTS);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},stage:"launch",eta,hasPriority:hasPrio,exactName:c.exactName});
      }else{
        const marker=L.marker([region.lat,region.lon],{icon:launcherIcon(stage,origin.name,confirmN,totalW,aiResult.level,hasPrio),zIndexOffset:940});
        marker.bindPopup(`<div class="popup-title type-launcher">ЗАГРОЗА · ${cls.label}</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Підтверджень: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`,CONFIG.POPUP_OPTS);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,stage,eta,hasPriority:hasPrio,exactName:c.exactName});
      }
      continue;
    }
    if(c.kind==="place"){
      const{place,cls,target,isApproach}=c;
      if(!inZone(place.lat,place.lon)&&!(target&&inZone(target.lat,target.lon)))continue;
      const alt=c.altitudeOverride!=null?c.altitudeOverride:parseAltitude({explanationShort:c.sampleText});
      const falling=isFallingMessage(c.sampleText);
      const exactName=c.exactName||detectExactName(c.sampleText);
      let hdg=null;
      if(target)hdg=bearingBetween(place.lat,place.lon,target.lat,target.lon);
      else{const{origin,dist}=nearestRussianOrigin(place.lat,place.lon);if(origin&&dist>=CONFIG.TRAIL_MIN_ORIGIN_DIST_KM)hdg=bearingBetween(origin.lat,origin.lon,place.lat,place.lon);else hdg=bearingBetween(place.lat,place.lon,CONFIG.KYIV[0],CONFIG.KYIV[1]);}
      const speed=resolveSpeedKmh(cls.type,c.sampleText);
      const eta=etaToKyivMin(place.lat,place.lon,cls.type,speed);
      const chainKey=`${cls.type}|${(target&&target.key)||place.key}|${(cls.isGeran5||cls.type==="geran5")?"g5":(cls.isJetDrone||cls.type==="jet_drone")?"jet":"std"}`;
      const{chain,isNewPoint}=appendTrailPoint(chainKey,cls,{lat:place.lat,lon:place.lon,name:(target&&target.name)||place.name,sampleText:c.sampleText,exactName,_infra:place._infra,_chornobyl:place._chornobyl},ch,msgMs);
      chain.aiResult=aiResult;chain.heading=hdg;chain.speedKmh=speed;
      const last=chain.points[chain.points.length-1];
      let markerRef=chain.markerRef;
      const inSiren=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],place.lat,place.lon)<=soundThresholdFor(cls.type);
      const isFuzzy=!!place._fuzzy;
      if(markerRef&&markerRef.marker){
        const cur=markerRef.marker.getLatLng();
        const needAnim=isNewPoint&&haversineKm(cur.lat,cur.lng,last.lat,last.lon)>0.05;
        if(needAnim){
          animateChainTransition(chainKey,{lat:cur.lat,lon:cur.lng},{lat:last.lat,lon:last.lon},markerRef.marker,cls,confirmN,totalW,isFuzzy,aiResult.level,null,inSiren,hasPrio,false,()=>{
            markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
          });
        }else{
          markerRef.marker.setLatLng([last.lat,last.lon]);
          markerRef.marker.setIcon(makeIcon(cls,hdg,confirmN,totalW,false,isFuzzy,aiResult.level,null,inSiren,hasPrio,false));
          markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
        }
      }else{
        const marker=L.marker([last.lat,last.lon],{icon:makeIcon(cls,hdg,confirmN,totalW,false,isFuzzy,aiResult.level,null,inSiren,hasPrio,false),zIndexOffset:900});
        marker.bindPopup(buildTrailPopupHtml(chain),CONFIG.POPUP_OPTS);
        marker.addTo(msgThreatLayer);
        marker.on("popupopen",()=>openTrail(chainKey));
        marker.on("popupclose",()=>closeTrailDrawing(chainKey));
        markerRef={marker,trailPoints:null};chain.markerRef=markerRef;
      }
      if((cls.type==="ballistic"||cls.type==="zircon")&&confirmN>=1)triggerBallisticAlarm("msg-place:"+key);
      const opts={id:key,marker:markerRef.marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,alt,falling,hdg,cls,place,targetPlace:target,eta,confirmN,totalWeight:totalW,channels:c.channels,heading:hdg,speedKmh:speed,chainKey,inSiren,_sim:false,hasPriority:hasPrio,priorityChannel:hasPrio?[...c.channels].find(ch=>isPriorityChannel(ch)):null,exactName};
      msgMarkers.set(key,opts);
      simulateMsgTrack(opts,key);
      maybeSirenForPlace(key,cls,place.lat,place.lon,hasPrio?[...c.channels].find(ch=>isPriorityChannel(ch)):null);
      scheduleFeedUpdate();
      continue;
    }
  }

  const impactCutoff=now-CONFIG.IMPACT_REPORT_TTL_MS;
  for(const[key,r]of[...impactReports]){if(r.lastSeen<impactCutoff){if(r.marker&&impactLayer)try{impactLayer.removeLayer(r.marker);}catch(e){}impactReports.delete(key);}}
  const cutoff=now-CONFIG.WARNING_GRACE_MS;
  for(const[id,w]of[...activeWarnings]){if(w.lastSeen<cutoff)activeWarnings.delete(id);}
  const nowTs=Date.now();
  for(const[key,chain]of[...trails])if(nowTs-chain.lastSeen>CONFIG.TRAIL_MAX_AGE_MS)closeTrail(key);
  const stratCutoff=now-CONFIG.STRATEGIC_ACTIVITY_TTL_MS;
  for(const[key,it]of[...strategicActivity]){
    if(it.lastSeen<stratCutoff&&!["bastion","iskander","zircon_kursk","caspian_calibr"].includes(key))removeStrategicKey(key);
  }
  for(const[key,c]of impacts){
    if(isDismissed(key))continue;
    const confirmN=c.channels.size;
    const totalW=totalWeightOf(c.channels);
    const hasPrio=hasPrioritySource(c.channels);
    if(!hasPrio&&confirmN<CONFIG.MIN_CHANNELS_CONFIRM)continue;
    if(!hasPrio&&totalW<2.0)continue;
    const eventAt=c.eventAt||c.lastSeen;
    const age=now-eventAt;
    if(age>CONFIG.IMPACT_TTL_MS){if(impactMarkers.has(key)){impactLayer.removeLayer(impactMarkers.get(key).marker);impactMarkers.delete(key);}continue;}
    if(!inZone(c.target.lat,c.target.lon))continue;
    const t=c.target;
    const aiResult=AI.score({channels:c.channels,firstSeen:eventAt,place:t,cls:null,target:t});
    const marker=L.marker([t.lat,t.lon],{icon:impactBigIcon("hit"),zIndexOffset:880});
    marker.bindPopup(`<div class="popup-title type-impact">💥 Вибух / приліт</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta">Місце: <b>${esc(t.name)}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}
      <button type="button" class="popup-remove-btn" data-remove-kind="impactMarker" data-remove-key="${esc(key)}">🗑 Видалити маркер</button>`,CONFIG.POPUP_OPTS);
    marker.addTo(impactLayer);
    if(impactMarkers.has(key))impactLayer.removeLayer(impactMarkers.get(key).marker);
    impactMarkers.set(key,{marker,lastSeen:eventAt,eventAt,confirmN,channels:c.channels,aiLevel:aiResult.level,kind:"msg"});
    showTopAlertForImpact({kind:"hit",icon:"💥",label:"Вибух / приліт",color:"#dc2626"},c.target,c.sampleText);
    scheduleFeedUpdate();
  }
  for(const[key,o]of[...msgMarkers]){if(now-o.lastSeen>CONFIG.STALE_MSG_MS){if(o.marker&&msgThreatLayer)msgThreatLayer.removeLayer(o.marker);if(o._simTimer)clearInterval(o._simTimer);msgMarkers.delete(key);}}
  for(const[key,o]of[...impactMarkers]){if((o.kind==="msg"||o.kind==="arrival"||o.kind==="unknown")&&now-(o.eventAt||o.lastSeen)>CONFIG.IMPACT_TTL_MS){impactLayer.removeLayer(o.marker);impactMarkers.delete(key);}}
}

const THREAT_WARNINGS_DB=[
  {id:"zircon_launch",re:/(?:циркон|zircon|3м22|3m22)/i,altRe:/(?:пуск|залп|курс|на\s+київ|на\s+киев|чорне\s+море|черное\s+море)/i,label:"🚨 ЦИРКОН — пуск/загроза"},
  {id:"kursk_ballistic",re:/(?:загроз[аи]|угроз[аы])\s+балістик/i,altRe:/(?:курськ|курск)/i,label:"🚨 Балістика з Курська"},
  {id:"kyiv_ballistic_night",re:/(?:підвищен[аоі]|повышенн[ао])/i,altRe:/(?:балістик|угроз|загроз|київ|киев|іскандер|с-?400|онікс|циркон)/i,label:"🚨 Загроза балістики для Києва"}
];
function upsertWarning(ww,ch,ms){if(!isPriorityChannel(ch)&&channelWeight(ch)<1.3)return;let w=activeWarnings.get(ww.id);if(!w){w={warning:ww,firstSeen:ms,lastSeen:ms,channels:new Set(),dismissed:false};activeWarnings.set(ww.id,w);if(isPriorityChannel(ch))playAlertSound(true);scheduleFeedUpdate();}w.channels.add(ch);if(ms<w.firstSeen)w.firstSeen=ms;if(ms>w.lastSeen)w.lastSeen=ms;}
function detectThreatWarnings(text){if(!text)return[];const found=[];for(const w of THREAT_WARNINGS_DB){if(w.re.test(text)&&w.altRe.test(text))found.push(w);}return found;}

   API TRACKS
============================================================ */
function updateSmooth(tr,lat,lon,t,hdg){
  if(!tr._s){tr._s={lat,lon,vx:0,vy:0,hdg:hdg||0,lastT:t,spd:0};return;}
  const dt=(t-tr._s.lastT)/3600000;
  if(dt<=0||dt>.4){tr._s.lat=lat;tr._s.lon=lon;tr._s.lastT=t;tr._s.hdg=hdg||tr._s.hdg;return;}
  const dist=haversineKm(tr._s.lat,tr._s.lon,lat,lon);
  const spd=dist/dt;
  const brg=bearingBetween(tr._s.lat,tr._s.lon,lat,lon);
  const a=CONFIG.SMOOTH_ALPHA;
  tr._s.lat=tr._s.lat*(1-a)+lat*a;tr._s.lon=tr._s.lon*(1-a)+lon*a;
  const rad=brg*Math.PI/180;
  tr._s.vx=tr._s.vx*.55+spd*Math.sin(rad)*.45;
  tr._s.vy=tr._s.vy*.55+spd*Math.cos(rad)*.45;
  tr._s.spd=Math.hypot(tr._s.vx,tr._s.vy);
  tr._s.hdg=(Math.atan2(tr._s.vx,tr._s.vy)*180/Math.PI+360)%360;
  tr._s.lastT=t;
}
function predict(tr,now){if(!tr._s)return[tr.baseLat,tr.baseLon];const dt=Math.min((now-tr._s.lastT)/3600000,CONFIG.EXTRAPOLATION_HOURS);const dist=(tr._s.spd||tr.speed||180)*dt;return destPoint(tr._s.lat,tr._s.lon,tr._s.hdg,dist);}
function spawnArrival(track,kind,lat,lon,cls){
  const key=`arrival:${track.id||Math.random().toString(36).slice(2,8)}`;
  const isBallistic=["ballistic","zircon","banderol","missile","kab","umpb"].includes(cls?.type||track.threat?.type);
  const iconHtml=kind==="unknown"?unknownArrivalIcon():L.divIcon({className:"",html:`<div class="impact-marker hit">${impactSvg()}</div>`,iconSize:[36,36],iconAnchor:[18,18]});
  const marker=L.marker([lat,lon],{icon:iconHtml,zIndexOffset:1500});
  const ttl=kind==="unknown"?CONFIG.ARRIVAL_UNKNOWN_TTL_MS:(isBallistic?CONFIG.BALLISTIC_ARRIVAL_TTL_MS:CONFIG.ARRIVAL_IMPACT_TTL_MS);
  marker.bindPopup(`<div class="popup-title type-impact">${kind==="unknown"?"❓":'💥'} ${esc(kind==="unknown"?"Точка прильоту невідома":typeLabel(track.threat||cls))}</div>
    <div class="popup-meta">Приліт: ${lat.toFixed(3)}, ${lon.toFixed(3)}<br>Час: ${new Date().toLocaleTimeString("uk-UA")}</div>
    <button type="button" class="popup-remove-btn" data-remove-kind="arrival" data-remove-key="${esc(key)}">🗑 Видалити маркер</button>`,CONFIG.POPUP_OPTS);
  marker.addTo(impactLayer);
  arrivals.set(key,{marker,t:Date.now()});
  setTimeout(()=>{try{impactLayer.removeLayer(marker);}catch(e){}arrivals.delete(key);},ttl);
  if(track.id)try{removeTrackInternal(track.id);}catch(e){}
}
function removeTrackInternal(id){const tr=tracks.get(id);if(!tr)return;try{if(threatLayer)threatLayer.removeLayer(tr.marker);}catch(e){}tracks.delete(id);}
function normalizeThreat(t){
  const o={...t};
  const txt=[t.type,t.title,t.explanationShort].filter(Boolean).join(" ");
  const cls=CLASSIFIER(txt);
  if(cls?.isZircon){o.type="zircon";o._zircon=true;}
  else if(cls?.isJetDrone){o.type="jet_drone";o._jetDrone=true;}
  else if(cls?.isGeran5){o.type="geran5";o._geran5=true;}
  else if(cls?.isGeran){o.type=cls.type;o._geran=true;}
  else if(cls&&!TYPE_META[t.type])o.type=cls.type;
  o._exactName=detectExactName(txt)||null;
  o._altitude=parseAltitude(t);
  o._falling=isFallingMessage(t.explanationShort||t.title||"");
  if(typeof t.count==="number"&&t.count>0)o._count=t.count;
  if(t.advisory===true)o.advisory=true;
  if(t.areaOnly===true)o.areaOnly=true;
  o._speed=resolveSpeedKmh(o.type,txt);
  o._distanceKm=parseDistanceFromKyiv(txt);
  o._etaRange=parseEtaRange(txt);
  return o;
}
function resolveHeading(t){if(t.heading!=null)return t.heading;if(t.velocity?.bearingDeg!=null)return t.velocity.bearingDeg;return null;}
function resolveBaseTime(t){const iso=t.confirmedAt||t.updatedAt;if(iso){const ms=Date.parse(iso);if(!isNaN(ms))return ms;}return Date.now();}
function isStale(bt){return(Date.now()-bt)>CONFIG.STALE_VISUAL_AFTER_HOURS*3600000;}
function buildThreatPopup(t,eta,stale,uncertain,extraChannels,hasPriority,isSimulated,simOriginName){
  const meta=getMeta(t.type);
  let label=t._exactName||meta.label;
  const loc=[t.locality,t.district,t.region].filter(Boolean).join(", ")||"—";
  const updated=t.updatedAt?new Date(t.updatedAt).toLocaleString("uk-UA"):"—";
  const alt=t._altitude;
  const exactLine=t._exactName?`<div class="popup-exactname">🏷 ${esc(t._exactName)}</div>`:"";
  const speedLine=t._speed?`<div class="popup-speed">⚡ Швидкість: <b>${t._speed} км/год</b></div>`:"";

function upsertThreat(raw){
  if(!threatLayer)return;
  try{
    const t=normalizeThreat(raw);
    if(t.lat==null||t.lon==null||t.areaOnly)return;
    if(t.status==="resolved"){removeTrackInternal(t.id);return;}
    if(!inZone(t.lat,t.lon)){removeTrackInternal(t.id);return;}
    let heading=resolveHeading(t);
    if(heading==null)heading=bearingBetween(t.lat,t.lon,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    const toKyiv=bearingBetween(t.lat,t.lon,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    const diff=Math.abs(((heading-toKyiv+540)%360)-180);
    if(diff>100)heading=toKyiv;
    const baseTime=resolveBaseTime(t);
    const existing=tracks.get(t.id);
    const uncertain=(t.uncertaintyKm!=null&&t.uncertaintyKm>CONFIG.UNCERTAIN_KM);
    const speed=t._speed||CONFIG.FALLBACK_SPEED[t.type]||180;
    const dKyiv=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],t.lat,t.lon);
    const inSiren=dKyiv<=soundThresholdFor(t.type);
    const eta=etaToKyivMin(t.lat,t.lon,t.type,speed);
    const conf=existing?._msgConfirm||0;
    const tw=existing?._msgChannels?totalWeightOf(existing._msgChannels):0;
    const hasPrio=existing?._msgChannels?hasPrioritySource(existing._msgChannels):false;
    if(existing){
      if(existing.isSimulated){existing.threat=t;existing.eta=eta;if(uncertain)existing.uncertain=uncertain;}
      else{
        updateSmooth(existing,t.lat,t.lon,baseTime,heading);
        existing.threat=t;existing.baseLat=t.lat;existing.baseLon=t.lon;existing.baseTime=baseTime;
        existing.heading=heading;existing.speed=speed;existing.inSiren=inSiren;existing.eta=eta;existing.uncertain=uncertain;
      }
      const st=isStale(baseTime);existing.stale=st;
      existing.marker.setIcon(makeIcon(t,existing.heading,conf,tw,st,existing.uncertain,null,null,inSiren,hasPrio,existing.isSimulated));
      existing.marker.setPopupContent(buildThreatPopup(t,eta,st,existing.uncertain,existing._msgChannels,hasPrio,existing.isSimulated,existing._simOriginName));
    }else{
      const st=isStale(baseTime);
      const marker=L.marker([t.lat,t.lon],{icon:makeIcon(t,heading,0,0,st,uncertain,null,null,inSiren,false,false),zIndexOffset:800});
      marker.bindPopup(buildThreatPopup(t,eta,st,uncertain,null,false,false,null),CONFIG.POPUP_OPTS);
      marker.addTo(threatLayer);
      const tr={id:t.id,marker,threat:t,baseLat:t.lat,baseLon:t.lon,baseTime,heading,speed,eta,uncertain,inSiren,stale:st,arrivalDone:false,_sirenFired:false,_s:{}};
      updateSmooth(tr,t.lat,t.lon,baseTime,heading);
      tracks.set(t.id,tr);
      if(t.type==="ballistic"||t.type==="zircon")triggerBallisticAlarm("api:"+t.id);
      scheduleFeedUpdate();
    }
    applyHighPrec();
  }catch(e){console.warn("upsertThreat",e);removeTrackInternal(raw?.id);}
}
function syncThreats(list){const seen=new Set();for(const t of list||[]){seen.add(t.id);upsertThreat(t);}for(const id of[...tracks.keys()])if(!seen.has(id))removeTrackInternal(id);}

function animate(){
  if(!animRunning||!map)return;
  const now=Date.now();
  for(const tr of tracks.values()){
    if(!tr._s||tr.threat.areaOnly||tr.threat.advisory)continue;
    const[lat,lon]=predict(tr,now);
    if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;
    tr.marker.setLatLng([lat,lon]);
    if(tr._s.hdg!=null){
      const conf=tr._msgConfirm||0,tw=tr._msgChannels?totalWeightOf(tr._msgChannels):0;
      const hasPrio=tr._msgChannels?hasPrioritySource(tr._msgChannels):false;
      tr.marker.setIcon(makeIcon(tr.threat,tr._s.hdg,conf,tw,tr.stale,tr.uncertain,null,null,tr.inSiren,hasPrio,tr.isSimulated));
    }
    const d=haversineKm(lat,lon,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    if(d<1.2&&!tr.arrivalDone){
      tr.arrivalDone=true;
      const isFuzzy=!!tr.uncertain||(tr.threat.uncertaintyKm>5);
      if(isFuzzy)spawnArrival(tr,"unknown",lat,lon,tr.threat);
      else spawnArrival(tr,"impact",lat,lon,tr.threat);
    }
  }
  rafId=requestAnimationFrame(animate);
}

  impactReports.clear();
  for(const[k,a]of[...arrivals]){try{impactLayer.removeLayer(a.marker);}catch(e){}}
  arrivals.clear();
  for(const k of[...strategicMarkers.keys()])removeStrategicKey(k);
  strategicActivity.clear();
  hideTopAlert();
  renderFeed();
}
function refreshAllIcons(){for(const tr of tracks.values()){try{const conf=tr._msgConfirm||0,tw=tr._msgChannels?totalWeightOf(tr._msgChannels):0;const hasPrio=tr._msgChannels?hasPrioritySource(tr._msgChannels):false;tr.marker.setIcon(makeIcon(tr.threat,tr.heading||(tr._s&&tr._s.hdg),conf,tw,tr.stale,tr.uncertain,null,null,tr.inSiren,hasPrio,tr.isSimulated));}catch(e){}}}

/* ============================================================
   UI BINDINGS
============================================================ */
$("btnRefresh").addEventListener("click",()=>{unlockAudio();if(wsConnected&&ws){try{ws.close();}catch(e){}wsConnect();}else startRestPolling();showToast("Оновлення…");});
$("btnClear").addEventListener("click",()=>{unlockAudio();clearAll();showToast("Очищено");});
$("btnAIExplain").addEventListener("click",()=>{unlockAudio();showAIExplain();});
$("aiModalClose").addEventListener("click",hideAIExplain);
$("aiModalBackdrop").addEventListener("click",e=>{if(e.target.id==="aiModalBackdrop")hideAIExplain();});
$("aiModalCopy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("aiModalBody").textContent||"");$("aiModalCopy").textContent="✅";setTimeout(()=>{$("aiModalCopy").textContent="📋 Копіювати";},1500);}catch(e){$("aiModalCopy").textContent="❌";setTimeout(()=>{$("aiModalCopy").textContent="📋 Копіювати";},1500);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("aiModalBackdrop").classList.contains("show"))hideAIExplain();});
$("panelHeader").addEventListener("click",()=>{const p=$("panel");if(p)p.classList.toggle("collapsed");});
$("topAlertClose").addEventListener("click",()=>hideTopAlert());
$("strategicPanelClose").addEventListener("click",()=>{$("strategicPanel").classList.remove("show");});

(function(){const b=$("soundToggle");if(!b)return;function update(){b.textContent=CONFIG.SOUND_ENABLED?"🔔":"🔕";b.className="sound-btn "+(CONFIG.SOUND_ENABLED?"on":"muted");}update();let last=0;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();const n=Date.now();playAlertSound(true);if(n-last<500){CONFIG.SOUND_ENABLED=!CONFIG.SOUND_ENABLED;update();showToast(CONFIG.SOUND_ENABLED?"🔔 увімк":"🔕 вимк");last=0;}else{last=n;showToast("🔔 тест");}});})();
(function(){const b=$("sirenBtn");if(!b)return;let last=0;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();const n=Date.now();if(n-last<500){triggerSirenSequence(3000,3);showToast("🚨 3× сирена");last=0;}else{playSirenOnce(3000);flashSirenBtn(3000);showToast("🚨 1× (2 тапи = 3×)");last=n;}});})();
(function(){const b=$("btnColorToggle");if(!b)return;function update(){const c=UAV_COLORS[uavColorIdx];b.textContent="🎨";b.style.background=c.hex;b.style.borderColor=(c.id==="white")?"rgba(148,163,184,.5)":"rgba(0,0,0,.35)";b.style.color=(c.id==="white"||c.id==="yellow")?"#1e293b":"#fff";}update();b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();uavColorIdx=(uavColorIdx+1)%UAV_COLORS.length;saveUavColor();update();refreshAllIcons();showToast("🎨 БПЛА/FPV: "+UAV_COLORS[uavColorIdx].name);unlockAudio();});})();
(function(){const b=$("btnRingsToggle");if(!b||!map)return;function apply(){if(ringsVisible){if(!map.hasLayer(ringsLayer))ringsLayer.addTo(map);b.classList.add("on");b.classList.remove("off");}else{if(map.hasLayer(ringsLayer))map.removeLayer(ringsLayer);b.classList.add("off");b.classList.remove("on");}}apply();b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();ringsVisible=!ringsVisible;try{localStorage.setItem(RINGS_KEY,ringsVisible?"1":"0");}catch(e2){}apply();showToast(ringsVisible?"🎯 Кільця УВІМК":"🎯 Кільця ВИКЛ");unlockAudio();});})();
(function(){const b=$("btnMapToggle");if(!b||!map)return;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();if(currentBase==="osm"){if(osmLayer)map.removeLayer(osmLayer);baseSat.addTo(map);currentBase="sat";b.classList.add("on");showToast("🛰 Супутник");}else{map.removeLayer(baseSat);osmLayer=L.tileLayer(CONFIG.TILE_URL,{maxZoom:19,attribution:CONFIG.TILE_ATTR});osmLayer.addTo(map);currentBase="osm";b.classList.remove("on");showToast("🗺 Схема");}});})();
(function(){const b=$("btnSettlements");if(!b)return;if(settlementsVisible)b.classList.add("on");b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();toggleSettlementsLayer();});})();
(function(){const b=$("btnStrategic");if(!b)return;if(strategicVisible)b.classList.add("on");b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();unlockAudio();toggleStrategicLayer();});})();

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopRestPolling();stopAnim();}
  else{if(!wsConnected)startRestPolling();startAnim();unlockAudio();}
});

/* ============================================================
   INIT
============================================================ */
(async function init(){
  try{
    setStatus("warn","ЗАГРУЗКА…");
    const ctrl=new AbortController();
    loadAlertGeo(ctrl.signal);
    wsConnect();
    fetchMessages();
    setInterval(fetchMessages,5000);
    startAnim();
    renderFeed();
    setInterval(renderFeed,8000);
    setTimeout(()=>unlockAudio(),500);
    updateSettlementsVisibility();
    if(strategicVisible&&strategicLayer&&map&&!map.hasLayer(strategicLayer))strategicLayer.addTo(map);
  }catch(e){showErr("init: "+(e&&e.message||e));}
})();
</script>
